name: Build Alex Fork

# Builds and pushes the Docker image to GHCR on every push to the
# feature/google-drive-integration branch, or when a v*-alex tag is pushed.
# The image is pushed to ghcr.io/alexandrecalvet/open-notebook
# No Docker Hub credentials needed — only GITHUB_TOKEN (auto-provided).

on:
  push:
    branches:
      - feature/google-drive-integration
    tags:
      - 'v*-alex'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to use (e.g. 1.8.2-alex)'
        required: false
        default: 'latest-alex'

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/alexandrecalvet/open-notebook

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Update uv.lock to include google-drive extras
        run: uv lock

      - name: Determine image tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Strip the leading 'v' from the tag name: v1.8.2-alex → 1.8.2-alex
            TAG="${{ github.ref_name }}"
            TAG="${TAG#v}"
          else
            # Branch push → use latest-alex
            TAG="latest-alex"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image will be tagged: ${{ env.GHCR_IMAGE }}:${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache-alex
          key: ${{ runner.os }}-buildx-alex-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-alex-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=local,src=/tmp/.buildx-cache-alex
          cache-to: type=local,dest=/tmp/.buildx-cache-alex-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache-alex
          mv /tmp/.buildx-cache-alex-new /tmp/.buildx-cache-alex

      - name: Build summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.GHCR_IMAGE }}:${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage in docker-compose.yml" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
          echo "image: ${{ env.GHCR_IMAGE }}:${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
