services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: start --log info --user root --pass root rocksdb:/mydata/mydatabase.db
    user: root  # Required for bind mounts on Linux
    ports:
      - "8000:8000"
    volumes:
      - ./surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    restart: always
    pull_policy: always

  open_notebook:
    image: ghcr.io/alexandrecalvet/open-notebook:1.8.2-alex
    ports:
      - "8502:8502"  # Web UI
      - "5055:5055"  # REST API
    environment:
      # REQUIRED: Change this to your own secret string
      # This encrypts your API keys in the database
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=change-me-to-a-secret-string

      # Database connection (default values - no need to change)
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASSWORD=root
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook

      # Google Drive Integration (optional)
      # Create OAuth credentials at https://console.cloud.google.com/
      # Leave commented out to disable the integration
      # - GOOGLE_DRIVE_CLIENT_ID=your-client-id.apps.googleusercontent.com
      # - GOOGLE_DRIVE_CLIENT_SECRET=your-client-secret
      # - GOOGLE_DRIVE_REDIRECT_URI=http://your-server:5055/api/drive/callback
      # - FRONTEND_URL=http://your-server:8502
    volumes:
      - ./notebook_data:/app/data
    depends_on:
      - surrealdb
    restart: always
    pull_policy: always
